<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melisa | Professional Model & Brand Ambassador | Athens & Gainesville, GA</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #D4AF37; /* Metallic Gold */
            --accent-hover: #f3cf65;
            --border: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .nav-logo {
            font-size: 2rem;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .nav-logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 80px;
            background: linear-gradient(rgba(18, 18, 18, 0.6), rgba(18, 18, 18, 0.95)), 
                        url('https://unsplash.com') no-repeat center center/cover;
        }

        .hero-content h1 {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            animation: fadeIn 1.5s ease;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--accent);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.4s ease;
        }

        .btn:hover {
            background-color: var(--accent);
            color: var(--bg-color);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* About Section */
        .section {
            padding: 7rem 0;
            border-bottom: 1px solid var(--border);
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 3.5rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 1px;
            background-color: var(--accent);
            margin: 1rem auto 0;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text h3 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .about-text p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 1rem;
            font-weight: 300;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 2rem;
        }

        .stat-item span {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--accent);
        }

        .stat-item label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        /* Portfolio Placeholder Grid */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .portfolio-item {
            position: relative;
            overflow: hidden;
            height: 450px;
            background-color: var(--surface-color);
            border: 1px solid var(--border);
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%);
            transition: all 0.5s ease;
        }

        .portfolio-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }

        .portfolio-overlay h4 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .portfolio-overlay p {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Pricing Section */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .price-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border);
            padding: 3rem 2rem;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .price-card.featured {
            border-color: var(--accent);
            position: relative;
        }

        .featured-tag {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--accent);
            color: var(--bg-color);
            padding: 0.25rem 1.5rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .price-card:hover {
            transform: translateY(-5px);
        }

        .price-card h3 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .price-card .subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .price-card .cost {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 2rem;
        }

        .price-features {
            list-style: none;
            text-align: left;
            margin-bottom: 3rem;
            font-weight: 300;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .price-features li {
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .price-features li::before {
            content: '✓ ';
            color: var(--accent);
            margin-right: 0.5rem;
        }

        /* Contact Section */
        .contact-content {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .contact-content p {
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .contact-info {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 3rem;
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            padding-top: 2rem;
        }

        .contact-info a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: var(--accent);
        }
