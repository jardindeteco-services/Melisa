<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melissa | Premium Fashion &amp; Commercial Model | Athens &amp; Gainesville, GA</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;          /* Jet Black Background */
            --surface-color: #0a0a0a;     /* Deep Onyx Surface */
            --accent-gold: #D4AF37;       /* Premium Gold for text */
            --accent-gold-hover: #F3CF65; /* Bright Gold */
            --neon-pink: #FF1493;         /* Deep Pink */
            --crimson-red: #DC143C;       /* Crimson Red */
            --text-secondary: #cccccc;
            --border: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--accent-gold);
            line-height: 1.6;
            overflow-x: hidden;
            background-color: var(--bg-color);
        }

        h1, h2, h3, .nav-logo {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Sleek Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid var(--crimson-red);
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 90px;
        }

        .nav-logo {
            font-size: 2.2rem;
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(220, 20, 60, 0.3);
        }

        .nav-logo span {
            color: var(--neon-pink);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
            text-shadow: 0 0 5px var(--accent-gold);
        }

        /* Dynamic High-End Hero */
        header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 90px;
            background: linear-gradient(135deg, rgba(220, 20, 60, 0.2), rgba(255, 20, 147, 0.1)), 
                        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.95)),
                        url('https://unsplash.com') no-repeat center center/cover;
        }

        .hero-content {
            z-index: 5;
            position: relative;
            padding: 0 1rem;
        }

        .hero-content h1 {
            font-size: 5.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-gold);
            font-weight: 700;
            text-shadow: 2px 2px 15px rgba(255, 20, 147, 0.4);
            animation: fadeIn 1.5s ease;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 3rem;
            font-weight: 200;
        }

        .btn {
            display: inline-block;
            padding: 1.2rem 3rem;
            background-color: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
            transition: all 0.4s ease;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--crimson-red), var(--neon-pink));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn:hover {
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        }

        .btn:hover::before {
            opacity: 1;
        }

        /* Section Layouts */
        .section {
            padding: 8rem 0;
            border-bottom: 1px solid #111;
            background-color: var(--bg-color);
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 4rem;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .section-title span {
            background: linear-gradient(45deg, var(--neon-pink), var(--crimson-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Slick About Block */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            align-items: center;
        }

        .about-text h3 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 1.5rem;
        }

        .about-text p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 1rem;
            font-weight: 200;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 3rem;
            border-top: 1px solid var(--crimson-red);
            padding-top: 2rem;
        }

        .stat-item span {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--accent-gold);
        }

        .stat-item label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        /* Portfolio Media Matrix */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2.5rem;
        }

        .portfolio-item {
            position: relative;
            overflow: hidden;
            height: 500px;
            background-color: var(--surface-color);
            border: 1px solid rgba(212, 175, 87, 0.1);
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) brightness(0.9);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .portfolio-item:hover img {
            transform: scale(1.05);
        }

        .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
        }

        .portfolio-overlay h4 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-top: 0.25rem;
        }

        .portfolio-overlay p {
            font-size: 0.75rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Premium Price Matrix */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
        }

        .price-card {
            background-color: var(--surface-color);
            border: 1px solid rgba(212, 175, 55, 0.1);
            padding: 4rem 2.5rem;
            text-align: center;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .price-card.featured {
            border: 1px solid var(--crimson-red);
            position: relative;
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.1);
        }

        .featured-tag {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, var(--crimson-red), var(--neon-pink));
            color: #ffffff;
            padding: 0.4rem 2rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .price-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.08);
        }

        .price-card h3 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
